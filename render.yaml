services:
  - type: web
    name: cardiosage
    region: singapore
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: CARDIOSAGE_DB
        value: /tmp/cardiosage.db
      - key: CARDIOSAGE_COOKIE_SECURE
        value: "true"
      - key: CARDIOSAGE_ADMIN_EMAIL
        sync: false
      - key: CARDIOSAGE_ADMIN_PASSWORD
        sync: false
